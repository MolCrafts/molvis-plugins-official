name: release

# `release / build` runs the checks, builds every plugin and stages the flat
# assets as a workflow artifact. A `v*` tag on MolCrafts (`publish`) then
# uploads them to the GitHub Release that jsDelivr serves (`release / assets`).
# workflow_dispatch is a dry run anywhere: same gates and staging, no upload.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# One group per file, workflow, event and ref; a release is never cancelled.
concurrency:
  group: release-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Where this run happens, decided once: MolCrafts/molcrafts-ci/actions/ci-context.
  context:
    name: release / context
    runs-on: ubuntu-latest
    outputs:
      tier: ${{ steps.context.outputs.tier }}
      upstream: ${{ steps.context.outputs.upstream }}
      integration: ${{ steps.context.outputs.integration }}
      skip-pr: ${{ steps.context.outputs.skip-pr }}
      publish: ${{ steps.context.outputs.publish }}
    steps:
      - id: context
        uses: MolCrafts/molcrafts-ci/actions/ci-context@master

  build:
    name: release / build
    needs: context
    if: github.event_name == 'workflow_dispatch' || needs.context.outputs.upstream == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: MolCrafts/molcrafts-ci/actions/setup-node@master
      - uses: MolCrafts/molcrafts-ci/actions/setup-python@master
      - run: uv tool install ruff && uv pip install --system pytest
      - run: npm run check

      # The host resolves a *flat* Release layout, so each package's dist/ is
      # copied top-level-only and its manifest entry loses the `dist/` prefix.
      # Sourcemaps and .DS_Store must not ship.
      - name: Stage flat release assets
        run: |
          set -euo pipefail
          rm -rf release-assets && mkdir -p release-assets
          stage() {
            [ -f "$1/dist/plugin.js" ] || return 0
            mkdir -p "release-assets/$2"
            find "$1/dist" -maxdepth 1 -type f \
              ! -name '*.map' ! -name '*.LICENSE.txt' ! -name '.DS_Store' \
              -exec cp {} "release-assets/$2/" \;
            node -e "const f=require('fs'),m=JSON.parse(f.readFileSync('$1/molvis.plugin.json'));m.entry='plugin.js';f.writeFileSync('release-assets/$2/molvis.plugin.json',JSON.stringify(m,null,2)+'\n')"
            echo "staged $1 -> release-assets/$2/"
          }
          stage . meta
          for d in plugins/*/; do stage "${d%/}" "$(basename "$d")"; done
          # Per-plugin zips for single-plugin install. The host resolves a
          # FLAT layout, so zip from inside each directory.
          for dir in release-assets/*/; do
            name=$(basename "$dir")
            [ "$name" = meta ] && continue
            (cd "$dir" && zip -qr "../${name}.zip" .)
          done

      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error


  assets:
    name: release / assets
    needs: [context, build]
    # A `v*` tag on MolCrafts, and nothing else: actions/ci-context decides.
    if: needs.context.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: release-assets/
      # Meta is the default install: its assets sit at the Release root.
      - name: Upload to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          (cd release-assets/meta && gh release upload "$TAG" ./* --clobber)
          gh release upload "$TAG" release-assets/*.zip --clobber
