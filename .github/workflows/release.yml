name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish assets for"
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins-official
    steps:
      # Sibling layout so the `file:../molvis/*` deps in package.json resolve
      # with a plain `npm install` — same as ci.yml and a local checkout.
      - uses: actions/checkout@v4
        with:
          path: plugins-official
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: MolCrafts/molvis
          path: molvis

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The kernel bootstrap is real Python now (src/py/**), linted and unit
      # tested like any other source in this repo.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff pytest
        working-directory: .

      - name: Build the host SDK
        working-directory: molvis
        run: |
          npm install
          npm run build:plugin
          npm run build:stage
      - run: npm install
      - run: npm run check:manifests
      - run: npm run check:official-plugins
      - run: npm run typecheck
      - run: npm run lint:py
      - run: npm run test
      - run: npm run build
      - run: npm run verify:bundle

      # The host resolves a *flat* Release layout, so each package's dist/ is
      # copied top-level-only and its manifest entry loses the `dist/` prefix.
      # Sourcemaps and .DS_Store must not ship.
      - name: Stage flat release assets
        run: |
          set -euo pipefail
          rm -rf release-assets && mkdir -p release-assets
          stage() {
            [ -f "$1/dist/plugin.js" ] || return 0
            mkdir -p "release-assets/$2"
            find "$1/dist" -maxdepth 1 -type f \
              ! -name '*.map' ! -name '*.LICENSE.txt' ! -name '.DS_Store' \
              -exec cp {} "release-assets/$2/" \;
            node -e "const f=require('fs'),m=JSON.parse(f.readFileSync('$1/molvis.plugin.json'));m.entry='plugin.js';f.writeFileSync('release-assets/$2/molvis.plugin.json',JSON.stringify(m,null,2)+'\n')"
            echo "staged $1 -> release-assets/$2/"
          }
          stage . meta
          for d in plugins/*/; do stage "${d%/}" "$(basename "$d")"; done

      - name: Create / update GitHub Release with flat plugin assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          # Ensure release exists
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
          # Upload each package directory as assets (prefix by package name for multi)
          # Meta is the default install: assets at release root for meta.
          if [ -d release-assets/meta ]; then
            (
              cd release-assets/meta
              gh release upload "$TAG" ./* --clobber
            )
          fi
          # Per-plugin zips for single-plugin install. `zip -r <z> <dir>`
          # stores paths as `release-assets/<name>/plugin.js`; the host
          # resolves a FLAT layout, so zip from inside the directory.
          for dir in release-assets/*/; do
            name=$(basename "$dir")
            [ "$name" = "meta" ] && continue
            (cd "$dir" && zip -r "../${name}.zip" .)
            gh release upload "$TAG" "release-assets/${name}.zip" --clobber
          done
