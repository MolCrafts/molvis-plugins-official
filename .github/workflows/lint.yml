name: lint

# Same jobs in every context (feature branch or dev/master, fork or
# upstream); see "CI and release" in README.md. A PR from a branch of the
# same repository skips what its push already ran.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [dev, master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && !contains(fromJSON('["refs/heads/dev","refs/heads/master","refs/heads/main"]'), github.ref) }}

jobs:
  # Manifest/package.json versions, molvis floors, OFFICIAL_PLUGINS roster,
  # and ruff over the Python the Pyodide kernel runs. Nothing installs.
  guards:
    name: lint / guards
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node
        with:
          install: "false"
      - uses: ./.github/actions/setup-python
      - run: uv tool install ruff
      - run: npm run check:manifests
      - run: npm run check:official-plugins
      - run: npm run lint:py

  typecheck:
    name: lint / typecheck
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node
      - run: npm run typecheck
