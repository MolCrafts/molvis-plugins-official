name: lint

# Same jobs in every context (feature branch or dev/master, fork or
# upstream); see "CI and release" in README.md.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [dev, master, main]
  workflow_dispatch:

permissions:
  contents: read

# One group per file, workflow, event and ref; only a feature ref cancels its
# superseded runs.
concurrency:
  group: lint-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !contains(fromJSON('["refs/heads/dev","refs/heads/master","refs/heads/main"]'), github.ref) && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Where this run happens, decided once: MolCrafts/molcrafts-ci/actions/ci-context.
  context:
    name: lint / context
    runs-on: ubuntu-latest
    outputs:
      tier: ${{ steps.context.outputs.tier }}
      upstream: ${{ steps.context.outputs.upstream }}
      integration: ${{ steps.context.outputs.integration }}
      skip-pr: ${{ steps.context.outputs.skip-pr }}
      publish: ${{ steps.context.outputs.publish }}
    steps:
      - id: context
        uses: MolCrafts/molcrafts-ci/actions/ci-context@master

  # Manifest/package.json versions, molvis floors, OFFICIAL_PLUGINS roster,
  # and ruff over the Python the Pyodide kernel runs. Nothing installs.
  guards:
    name: lint / guards
    needs: context
    if: needs.context.outputs.skip-pr != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: MolCrafts/molcrafts-ci/actions/setup-node@master
        with:
          install: "false"
      - uses: MolCrafts/molcrafts-ci/actions/setup-python@master
      - run: uv tool install ruff
      - run: npm run check:manifests
      - run: npm run check:official-plugins
      - run: npm run lint:py

  typecheck:
    name: lint / typecheck
    needs: context
    if: needs.context.outputs.skip-pr != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: MolCrafts/molcrafts-ci/actions/setup-node@master
      - run: npm run typecheck

  # The workflows against the CI scheme: MolCrafts/molcrafts-ci/actions/check-workflows.
  workflows:
    name: lint / workflows
    needs: context
    if: needs.context.outputs.skip-pr != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: MolCrafts/molcrafts-ci/actions/check-workflows@master
