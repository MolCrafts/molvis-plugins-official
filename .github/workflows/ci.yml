name: ci

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The kernel bootstrap is real Python now (src/py/**), linted and unit
      # tested like any other source in this repo.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff pytest
      # The plugin SDK is not published yet; link it from the host repo.
      - uses: actions/checkout@v4
        with:
          repository: MolCrafts/molvis
          path: .molvis
      - run: npm install
      - name: Link the host SDK
        run: |
          npm install --prefix .molvis
          for p in core stage plugin; do (cd .molvis/$p && npm link); done
          npm run build:core --prefix .molvis
          npm run build:stage --prefix .molvis
          npm run build:plugin --prefix .molvis
          npm link @molcrafts/molvis-core @molcrafts/molvis-stage @molcrafts/molvis-plugin
      - run: npx playwright install --with-deps chromium
      - run: npm run check:manifests
      - run: npm run check:meta-version
      - run: npm run typecheck
      - run: npm run lint:py
      - run: npm run test
      - run: npm run build
      - run: npm run verify:bundle
      - run: npm run test:e2e
      - run: node scripts/prepare-release-assets.mjs
      - name: Upload release-assets (CI artifact; not committed)
        uses: actions/upload-artifact@v4
        with:
          name: plugin-release-assets
          path: release-assets/
          if-no-files-found: error
