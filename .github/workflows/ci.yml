name: ci

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run check:contract
      - run: npm run check:manifests
      - run: npm run check:meta-version
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm run test:e2e
      - run: node scripts/prepare-release-assets.mjs
      - name: Upload release-assets (CI artifact; not committed)
        uses: actions/upload-artifact@v4
        with:
          name: plugin-release-assets
          path: release-assets/
          if-no-files-found: error
