name: ci

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # No package-lock — fresh resolve each run (lockfiles are gitignored).
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run check:contract
      # Per-package only: molvis.plugin.json version == that package's package.json.
      - run: npm run check:manifests
      # Meta MAJOR.MINOR.PATCH: major=system, minor=plugin count, patch=fixes.
      - run: npm run check:meta-version
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm run test:e2e
      # dist/ is committed for jsDelivr (`gh/…@tag/…`). Build above must match git.
      - name: Ensure committed dist is up to date
        run: |
          git add -f dist plugins/*/dist
          if ! git diff --cached --quiet; then
            echo "::error::dist/ is stale. Run npm run build and commit dist/ (and plugins/*/dist)."
            git diff --cached --stat
            exit 1
          fi
          echo "dist/ matches this build (jsDelivr-ready)."
      - name: Upload dist artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-dist
          path: |
            dist/
            plugins/*/dist/
          if-no-files-found: warn
