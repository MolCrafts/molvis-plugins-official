name: ci

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins-official
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugins-official
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff pytest
        working-directory: .
      - run: npm install
      - run: npm run check:manifests
      - run: npm run check:official-plugins
      - run: npm run typecheck
      - run: npm run lint:py
      - run: npm run test
      - run: npm run build
      - run: npm run verify:bundle
