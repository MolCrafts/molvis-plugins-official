name: test

# Contexts (see "CI and release" in README.md):
#   feature branch push (fork or upstream)  test / unit
#   dev / master / main, or a PR into one    + test / bundle
# A PR from a branch of the same repository skips what its push already ran.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [dev, master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && !contains(fromJSON('["refs/heads/dev","refs/heads/master","refs/heads/main"]'), github.ref) }}

jobs:
  # rstest for every plugin and the meta package, plus the kernel's pytest.
  unit:
    name: test / unit
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-python
      - run: uv pip install --system pytest
      - run: npm test

  # The Release assets: every plugin.js parses, and the Pyodide plugin ships
  # its kernel runtime and wheels.
  bundle:
    name: test / bundle
    if: github.event_name != 'push' || contains(fromJSON('["refs/heads/dev","refs/heads/master","refs/heads/main"]'), github.ref)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-python
      - run: npm run build
      - run: npm run verify:bundle
