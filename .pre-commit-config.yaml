# Local gates that must match CI (.github/workflows/ci.yml `check` job).
# Install: pip install pre-commit && pre-commit install
# Run all: pre-commit run --all-files
#
# Same command as mol_project.build.check / CI: npm run check
# (manifests + official roster + typecheck + lint:py + test + build + verify).

repos:
  - repo: local
    hooks:
      - id: check
        name: npm run check
        entry: bash -c 'npm run check'
        language: system
        pass_filenames: false
        always_run: true
